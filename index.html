<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  --bg:#0a0c14; --text:#eef0f7; --muted:#9aa1b8;
  --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.16); --accent:#8fb4ff;
  --ok:#2fd27a; --ok-bg:rgba(47,210,122,.22);
  --bad:#ff5d6c; --bad-bg:rgba(255,93,108,.22);
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{
  min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px);
  background:#11142c;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--ui);background:transparent}
body::before{
  content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(to bottom,#11142c 0,rgba(17,20,44,0) 150px,rgba(17,20,44,0) calc(100% - 150px),#11142c 100%),
    radial-gradient(600px 420px at 12% 6%,rgba(92,120,255,.40),transparent 70%),
    radial-gradient(560px 460px at 92% 28%,rgba(190,90,255,.28),transparent 70%),
    radial-gradient(700px 520px at 50% 100%,rgba(30,190,200,.26),transparent 70%),
    var(--bg);
}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.4);
}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
header b{color:var(--text);font-weight:600}
.pill{padding:7px 14px;border-radius:999px}

.scene{perspective:1400px}
.card{display:grid;transition:transform .8s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;min-height:290px}
.card.flipped{transform:rotateY(180deg)}
.face{
  grid-area:1/1;border-radius:28px;padding:28px 26px;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  display:flex;flex-direction:column;justify-content:center;
}
.front{align-items:center;text-align:center;gap:14px}
.back{transform:rotateY(180deg);gap:14px;background:var(--glass-hi)}
.word{overflow-wrap:anywhere;font-family:var(--display);font-weight:500;font-size:clamp(2.8rem,12vw,5.2rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.meta{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:1.02rem}
.meta em{font-family:var(--display);color:var(--text)}
.reg{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.mic{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);padding:0;
  background:var(--glass-hi);border:1px solid var(--edge);transition:transform .15s,background .2s;
}
.mic:hover{background:rgba(255,255,255,.2)}.mic:active{transform:scale(.92)}
.mic svg{width:18px;height:18px}
.back h2{font-family:var(--display);font-size:1.7rem;font-weight:500;margin:0}
.back h2 small{font-family:var(--ui);font-size:.9rem;color:var(--muted);font-weight:400;margin-left:8px}
.senses{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:1.02rem;line-height:1.5}
.senses .n{color:var(--accent);font-weight:600;margin-right:6px}
.senses .alt{margin-top:6px;padding-left:18px;position:relative;color:#d6daea}
.senses .alt::before{content:"•";position:absolute;left:4px;color:var(--accent)}
.senses i{color:var(--muted)}
.senses .lead{font-style:italic;color:var(--accent)}
.senses .dl{font-style:italic;color:#c4c9dd}

.choices{display:flex;flex-direction:column;gap:12px}
.choice{
  text-align:left;font:inherit;color:inherit;font-size:1rem;line-height:1.45;cursor:pointer;
  padding:16px 18px;border-radius:20px;transition:transform .15s,background .3s,border-color .3s,box-shadow .3s;
  animation:rise .5s both;
}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
.choice:not(:disabled):hover{transform:translateY(-2px);background:var(--glass-hi)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--ok-bg);border-color:var(--ok);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 3px rgba(47,210,122,.25),0 0 30px rgba(47,210,122,.3);animation:pop .45s}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 3px rgba(255,93,108,.22),0 0 30px rgba(255,93,108,.28);animation:shake .45s}
.choice.dim{opacity:.55}
.next{
  align-self:center;font:inherit;font-weight:600;color:var(--text);cursor:pointer;padding:13px 28px;border-radius:999px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .35s,transform .35s,background .2s;
}
.next.show{opacity:1;transform:none;pointer-events:auto}
.next:hover{background:var(--glass-hi)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

const POS_RE = /^(plural noun|noun|verb|adjective|adverb|preposition|conjunction|pronoun|phrase|exclamation|determiner|abbreviation)\b/i;
const POS_IN = /^(.*?)\s+(plural noun|noun|verb|adjective|adverb|preposition|conjunction|pronoun|phrase)\b(.*)$/i;
function splitDef(t){
  t = t.trim();
  let lead = '';
  let m = t.match(/^(noun|verb|adjective|adverb):\s+(.*)$/);
  if(m){ lead = m[1]; t = m[2]; }
  else if((m = t.match(/^(.{1,70}?) — (.+)$/)) && !/: /.test(m[1])){ lead = m[1]; t = m[2]; }
  const i = t.indexOf(': ');
  return i > -1 ? {lead, def:t.slice(0,i).trim(), ex:t.slice(i+2).trim()} : {lead, def:t, ex:''};
}
function isHeader(l){
  if(!l.includes(' | ') || /^(\d+\.|[•\-*])/.test(l)) return false;
  const first = l.split(' | ')[0];
  return first.length <= 40 && !/[:.]/.test(first);
}
function parseHeader(l){
  const t = l.split(' | ').map(s => s.trim());
  const word = t[0].replace(/(?<=[a-z])\s*\d+$/i, '');
  const rest = t.slice(1).join(' | ').replace(/\((?:also|plural|singular)(?:[^()]|\([^()]*\))*\)/gi, '').replace(/\s+/g,' ').trim();
  let pieces = rest.split('|').map(s => s.trim()).filter(Boolean);
  let pron = '', pos = '', reg = '';
  if(pieces.length === 1 && !POS_RE.test(pieces[0])){
    const m = pieces[0].match(POS_IN);
    if(m){ pron = m[1]; pieces = [m[2] + m[3]]; } else { pron = pieces[0]; pieces = []; }
  } else if(pieces.length && !POS_RE.test(pieces[0])){
    pron = pieces.shift();
  }
  if(pieces.length){
    const last = pieces[pieces.length-1];
    const m = last.match(POS_RE);
    if(m){
      pos = m[1].toLowerCase();
      reg = pieces.slice(0,-1).concat(last.slice(m[0].length).trim()).filter(Boolean).join(' ').trim();
    } else {
      reg = pieces.join(' ');
    }
  }
  return {word, pron, pos, reg};
}
function parse(raw){
  const entries = [];
  let e = null;
  for(let l of raw.split('\n')){
    l = l.trim();
    if(!l) continue;
    if(isHeader(l)){
      e = {...parseHeader(l), senses: [], numbered: false};
      entries.push(e);
      continue;
    }
    if(!e) continue;
    const b = l.match(/^[•\-*]\s*(.*)$/);
    if(b){
      const d = splitDef(b[1]);
      const s = e.senses[e.senses.length-1];
      if(s) s.alts.push(d); else e.senses.push({...d, alts: []});
    } else {
      if(/^\d+\.\s/.test(l)) e.numbered = true;
      e.senses.push({...splitDef(l.replace(/^\d+\.\s*/,'')), alts: []});
    }
  }
  const seen = new Map();
  for(const x of entries){
    if(!x.senses.length) continue;
    if(!x.pos){
      const leads = [...new Set(x.senses.map(s => s.lead).filter(v => /^(noun|verb|adjective|adverb)$/.test(v)))];
      if(leads.length) x.pos = leads.join(' / ');
    }
    const k = x.word.toLowerCase() + '|' + x.pron;
    const size = x.senses.reduce((n,s) => n + 1 + s.alts.length, 0);
    const old = seen.get(k);
    if(!old || size >= old.size) seen.set(k, {x, size});
  }
  return [...seen.values()].map(v => v.x);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/(\w)'/g, '$1\u2019').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = s.trim(); s = s.charAt(0).toUpperCase() + s.slice(1); return /[.!?]$/.test(s) ? s : s + '.'; };

/* italicise leading descriptors such as "Medicine", "informal", "archaic or literary" */
const LBL = new Set(['informal','formal','archaic','literary','derogatory','historical','humorous','rare','dated','technical','mainly','chiefly','often','medicine','philosophy','heraldry','mathematics','physics','psychiatry','zoology','biology','economics','law','music','sailing','grammar','linguistics','physiology','surgery','astronomy','geology','ecology','psychology']);
const MODS = new Set(['mainly','chiefly','often']);
function splitLabel(d){
  const rg = d.match(/^(British|North American|US|American) English\b/);
  if(rg) return {label: rg[0], rest: d.slice(rg[0].length).trim()};
  const w = d.split(' ');
  const norm = x => x.toLowerCase().replace(/,$/, '');
  let i = 0, real = false;
  while(i < w.length){
    const t = norm(w[i]);
    if((t === 'or' || t === 'and') && i > 0 && i + 1 < w.length && LBL.has(norm(w[i+1]))){ i++; continue; }
    if(!LBL.has(t)) break;
    if(!MODS.has(t)) real = true;
    i++;
  }
  if(!real || i >= w.length) return {label: '', rest: d};
  return {label: w.slice(0, i).join(' ').replace(/,$/, ''), rest: w.slice(i).join(' ')};
}
function plain(d){ const s = splitLabel(d.trim()); return s.label ? s.rest : d; }
function dh(d){
  d = d.trim();
  const s = splitLabel(d);
  if(!s.label) return esc(fmt(d));
  const r = /[.!?]$/.test(s.rest) ? s.rest : s.rest + '.';
  return `<em class="dl">${esc(s.label)}</em> ${esc(r)}`;
}
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* Treat pronunciation as media playback so it ignores the silent switch (iOS) */
let silentEl = null;
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  try{
    if(!silentEl){
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
      const w = (o,s) => { for(let i=0;i<s.length;i++) b[o+i] = s.charCodeAt(i); };
      w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
      v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
      b.fill(128,44);
      let s = ''; for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
      silentEl = new Audio('data:audio/wav;base64,' + btoa(s));
    }
    silentEl.play().catch(() => {});
  }catch(e){}
}
function speak(w){
  unlockAudio();
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.85; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- game ---------- */
const DECK = parse(RAW);
let cur = null, last = null, answered = false, streak = 0, best = 0, options = [], angle = 0;
try{ best = +localStorage.getItem('wordflip-best') || 0; }catch(e){}

function renderScore(){ $('#streak').textContent = streak; $('#best').textContent = best; }

const micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

function renderRound(deferBack){
  answered = false;
  const pool = DECK.filter(e => e !== last);
  cur = rnd(pool.length ? pool : DECK);
  last = cur;
  const sense = rnd(cur.senses);
  const others = shuffle(DECK.filter(e => e.word.toLowerCase() !== cur.word.toLowerCase())).slice(0,2).map(e => ({t: plain(rnd(e.senses).def), ok:false}));
  options = shuffle([{t: plain(sense.def), ok:true}, ...others]);

  const reg = cur.reg ? `<span class="reg">${esc(cur.reg)}</span>` : '';
  $('#front').innerHTML =
    `<h1 class="word">${esc(cur.word)}</h1>
     <div class="meta">${cur.pos ? `<em>${esc(cur.pos)}</em>` : ''}${reg}${cur.pron ? `<span>${esc(cur.pron)}</span>` : ''}
     <button class="mic" id="mic" aria-label="Play pronunciation" title="Play pronunciation">${micSvg}</button></div>`;
  $('#mic').onclick = () => speak(cur.word);

  const sensesHtml = cur.senses.map((s,i) => {
    const num = cur.numbered && cur.senses.length > 1 ? `<span class="n">${i+1}.</span>` : '';
    const ld = x => x.lead ? `<span class="lead">${esc(x.lead)}</span> — ` : '';
    const ex = x => x.ex ? ` <i>${esc(fmt(x.ex))}</i>` : '';
    const alts = s.alts.map(a => `<div class="alt">${ld(a)}${dh(a.def)}${ex(a)}</div>`).join('');
    return `<li>${num}${ld(s)}${dh(s.def)}${ex(s)}${alts}</li>`;
  }).join('');
  const backHtml =
    `<h2>${esc(cur.word)}<small>${[cur.pron, [cur.pos, cur.reg].filter(Boolean).join(' ')].filter(Boolean).map(esc).join(' · ')}</small></h2>
     <ul class="senses">${sensesHtml}</ul>`;
  if(deferBack) setTimeout(() => { $('#back').innerHTML = backHtml; }, 450);
  else $('#back').innerHTML = backHtml;

  const box = $('#choices');
  box.innerHTML = '';
  options.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'choice glass';
    b.textContent = fmt(o.t);
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  $('#next').classList.remove('show');
}

function answer(i){
  if(answered) return;
  answered = true;
  const btns = [...document.querySelectorAll('.choice')];
  const right = options[i].ok;
  btns.forEach(b => { b.disabled = true; });
  btns[i].classList.add(right ? 'correct' : 'wrong');
  if(!right){
    setTimeout(() => btns[options.findIndex(o => o.ok)].classList.add('correct'), 450);
    btns.forEach((b,k) => { if(k !== i && !options[k].ok) b.classList.add('dim'); });
    streak = 0;
  } else {
    streak++;
    btns.forEach((b,k) => { if(k !== i) b.classList.add('dim'); });
    if(streak > best){ best = streak; try{ localStorage.setItem('wordflip-best', best); }catch(e){} }
  }
  renderScore();
  setTimeout(() => {
    try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
    angle += 180; $('#card').style.transform = `rotateY(${angle}deg)`;
  }, 650);
  setTimeout(() => $('#next').classList.add('show'), 1000);
}

function next(){
  if(!answered) return;
  $('#next').classList.remove('show');
  try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  angle += 180;
  $('#card').style.transform = `rotateY(${angle}deg)`;
  renderRound(true);
}
$('#next').onclick = next;
document.addEventListener('keydown', e => {
  if(e.key >= '1' && e.key <= '3') answer(+e.key - 1);
  else if(answered && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')){ e.preventDefault(); next(); }
});

/* swipe right-to-left = next word (only after answering) */
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if(!answered) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(dx < -60 && Math.abs(dx) > Math.abs(dy) * 1.5) next();
}, {passive:true});

if(DECK.length < 3){
  $('#front').innerHTML = '<p class="meta">Add at least three words to the list to play.</p>';
} else {
  renderScore();
  renderRound();
}
</script>
</body>
</html>
